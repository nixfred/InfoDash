    <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1.1)">
      <path d="M28 2 L52 15 L52 40 L28 53 L4 40 L4 15 Z" fill="none" stroke="#7ff9bc" stroke-opacity="0.05" stroke-width="1"/>
